name: Prepare Release

# 版本发布流程的第一阶段：创建「Release vX.Y.Z」PR。
#
# 触发方式：
# - 推送带 * 标记（fix*: / feat*: / perf*: / refactor*:）、! 标记或
#   BREAKING CHANGE footer 的提交到 main/master（自动检测 bump）
# - 手动触发（workflow_dispatch）：在 Actions 页面手动运行并填写
#   bump 级别（patch / minor / major）或显式版本号（如 1.20.0、
#   1.20.0-beta.1），不依赖提交标记
#
# 合并该 PR 会触发 create-release-tag.yml 打 tag，并触发 release.yml
# 构建与发布。
#
# 在 Release PR 里选择版本类型：
#   - 默认（无 label）：发行版，版本号 vX.Y.Z
#   - 添加 label `release: beta` / `release: rc` / `release: alpha`：
#     自动生成开发版版本号（vX.Y.Z-beta.1 等）并更新 PR 标题

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: "手动发版：patch / minor / major 或显式版本号（如 1.20.0、1.20.0-beta.1）"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  electron_config_cache: ${{ github.workspace }}/.cache/electron

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.detect.outputs.bump }}
      next_version: ${{ steps.detect.outputs.next_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect bump level
        id: detect
        env:
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
        run: |
          if [ -n "${MANUAL_BUMP}" ]; then
            # 手动触发：直接使用输入的 bump 级别或显式版本号（校验合法性）。
            python scripts/manual_release_version.py
          else
            python scripts/detect_bump.py --github-output "$GITHUB_OUTPUT"
          fi

      - name: Stop when no release is needed
        if: ${{ steps.detect.outputs.bump == '' }}
        run: echo "No release bump detected for this push."

  create-release-pr:
    needs: detect-release
    if: ${{ needs.detect-release.outputs.bump != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Skip when an open release PR already exists
        id: existing
        env:
          NEXT_VERSION: ${{ needs.detect-release.outputs.next_version }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          open_pr="$(gh pr list \
            --head "release/v${NEXT_VERSION}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "${open_pr}" ]; then
            echo "Release PR #${open_pr} for v${NEXT_VERSION} is already open; skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          # A stale branch may linger after a closed Release PR. Remove it so
          # the steps below can recreate the release branch from latest master.
          if git ls-remote --exit-code --heads origin "refs/heads/release/v${NEXT_VERSION}" >/dev/null 2>&1; then
            echo "Removing stale release branch release/v${NEXT_VERSION} (no open PR)."
            git push origin --delete "release/v${NEXT_VERSION}" 2>/dev/null || true
          fi

      - name: Bump version and create release branch
        if: ${{ steps.existing.outputs.skip != 'true' }}
        env:
          BUMP: ${{ needs.detect-release.outputs.bump }}
          NEXT_VERSION: ${{ needs.detect-release.outputs.next_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git"

          python scripts/bump_version.py "${BUMP}"
          git checkout -b "release/v${NEXT_VERSION}"
          git add VERSION pyproject.toml apps/service/pyproject.toml \
            packages/core/pyproject.toml packages/infra/pyproject.toml \
            apps/desktop/package.json apps/desktop/package-lock.json \
            packages/npx/package.json packages/npx/package-lock.json
          git commit -m "chore(release): v${NEXT_VERSION} [skip ci]"
          git push origin "HEAD:release/v${NEXT_VERSION}"

      - name: Open release pull request
        if: ${{ steps.existing.outputs.skip != 'true' }}
        env:
          NEXT_VERSION: ${{ needs.detect-release.outputs.next_version }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cat > /tmp/release-pr-body.md <<EOF
          ## 发布准备

          合并此 PR 即发布 **v${NEXT_VERSION}**（发行版）。合并后工作流会自动打 tag
          v${NEXT_VERSION} 并触发构建与 GitHub Release 发布。

          ### 选择版本类型

          - **发行版**（默认）：保持现状，直接合并。
          - **开发版/预发布**：给本 PR 添加 label release:beta（或 release:rc /
            release:alpha），工作流会自动把版本号更新为 v${NEXT_VERSION}-beta.1 并
            同步修改本 PR 标题；再次添加同名 label 会递增序号（-beta.2）。移除 label
            则恢复为发行版。

          > 预发布版本发布为 GitHub Prerelease，且不会覆盖稳定版升级通道
          > （latest.yml / latest-mac.yml），仅提供手动下载。
          EOF
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "release/v${NEXT_VERSION}" \
            --title "Release v${NEXT_VERSION}" \
            --body-file /tmp/release-pr-body.md
